<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Meme Generator Dinamis</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- Font Anton (alternatif Impact yang gratis & aman dipakai di web) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; }
        /* Warna teks eksplisit: tanpa ini, teks tanpa kelas warna mewarisi warna putih dari viewer bertema gelap */
        body, label, span, textarea, input, button, summary { color: #1e293b; }
        textarea::placeholder { color: #94a3b8; opacity: 1; }
        .custom-slider::-webkit-slider-thumb {
            appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }
        /* Canvas = hasil akhir. Ukuran mengikuti rasio foto asli, tanpa fill kosong */
        #memeCanvas {
            display: block;
            max-width: 100%;
            max-height: 32vh; max-height: 32dvh;
            width: auto;
            height: auto;
        }
        /* Selector ID di atas mengalahkan class .hidden dari Tailwind, jadi harus ditegaskan di sini */
        #memeCanvas.hidden { display: none; }
        body.bg-slate-50 { padding-top: max(0.5rem, env(safe-area-inset-top)); padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); padding-left: max(0.5rem, env(safe-area-inset-left)); padding-right: max(0.5rem, env(safe-area-inset-right)); }
        .stage { box-shadow: 0 8px 8px -8px rgba(0,0,0,.18); }
        input[type=range] { touch-action: pan-y; }
        @media (max-width: 640px) { textarea.text-sm { font-size: 16px; } }
        @media (pointer: coarse) { button, summary, [role=tab] { min-height: 44px; } }
        /* Dua kolom: PC/tablet lebar dan HP landscape (layar pendek) */
        @media (min-width: 1024px), (orientation: landscape) and (max-height: 520px) and (min-width: 560px) {
            .layout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; align-items: start; }
            .stage { top: 0.5rem !important; margin-left: 0 !important; margin-right: 0 !important; padding-left: 0 !important; padding-right: 0 !important; box-shadow: none; }
            #memeCanvas { max-height: 65vh; max-height: 65dvh; }
            .checker { min-height: 240px !important; }
        }
        .checker {
            background-color: #f1f5f9;
            background-image:
                linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
                linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
                linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-start sm:items-center justify-center p-2 sm:p-4">

    <div class="bg-white w-full max-w-5xl rounded-2xl shadow-xl p-4 sm:p-6 lg:p-8 space-y-4">
        <div class="flex items-start justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800" data-i18n="title">Meme Generator</h1>
                <p class="text-slate-500 text-sm mt-1" data-i18n="subtitle"></p>
            </div>
            <!-- Pilihan bahasa -->
            <div class="flex shrink-0 rounded-xl border border-slate-200 overflow-hidden text-xs font-semibold" role="group" aria-label="Language">
                <button type="button" id="langId" onclick="setLang('id')" class="px-3 py-1.5 transition">ID</button>
                <button type="button" id="langEn" onclick="setLang('en')" class="px-3 py-1.5 transition">EN</button>
            </div>
        </div>

        <!-- Upload Foto (input asli disembunyikan, teksnya ikut bahasa pilihan) -->
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="upload"></label>
            <div class="flex items-center gap-3">
                <input type="file" id="imageInput" accept="image/*" class="peer sr-only">
                <label for="imageInput" class="shrink-0 cursor-pointer py-2 px-4 rounded-xl bg-blue-50 text-blue-700 text-sm font-semibold hover:bg-blue-100 transition peer-focus-visible:ring-2 peer-focus-visible:ring-blue-500" data-i18n="chooseFile"></label>
                <span id="fileName" class="text-sm text-slate-500 truncate"></span>
            </div>
            <!-- Catatan privasi: tepat di bawah tombol upload, saat orang paling mungkin bertanya "fotoku dikirim ke mana?" -->
            <p class="mt-3 flex items-start gap-2 rounded-xl bg-emerald-50 border border-emerald-100 px-3 py-2 text-xs text-emerald-800">
                <span aria-hidden="true">🔒</span>
                <span data-i18n="privacy"></span>
            </p>
        </div>

        <!-- Layout: preview menempel di atas (HP) / kiri (PC), kontrol bertab di bawah / kanan -->
        <div class="layout">
            <div class="stage sticky top-0 z-20 -mx-4 sm:-mx-6 px-4 sm:px-6 bg-white pb-3 space-y-2" style="padding-top:0.5rem">
                <div class="checker rounded-xl p-2 flex items-center justify-center min-h-[120px]">
                    <canvas id="memeCanvas" class="hidden"></canvas>
                    <div id="placeholderText" class="text-slate-400 text-sm text-center p-4" data-i18n="placeholder"></div>
                </div>
                <button id="downloadBtn" onclick="downloadMeme()" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200 hidden" data-i18n="download"></button>
            </div>

            <div class="mt-3 min-w-0">
                <div role="tablist" class="grid grid-cols-3 gap-2 text-sm font-semibold">
                    <button type="button" role="tab" data-tab="text" onclick="setTab('text')" class="rounded-lg px-2 py-2 transition" data-i18n="tabText"></button>
                    <button type="button" role="tab" data-tab="style" onclick="setTab('style')" class="rounded-lg px-2 py-2 transition" data-i18n="tabStyle"></button>
                    <button type="button" role="tab" data-tab="image" onclick="setTab('image')" class="rounded-lg px-2 py-2 transition" data-i18n="tabImage"></button>
                </div>

                <div data-panel="text" role="tabpanel" class="space-y-6 pt-4">
        <!-- Daftar teks (bisa lebih dari satu: atas, bawah, dst.) -->
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="textLabel"></label>
            <div id="layers" class="space-y-3"></div>
            <button type="button" id="addLayerBtn" onclick="addLayer()" class="mt-3 w-full py-2.5 rounded-xl border-2 border-dashed border-slate-300 text-sm font-semibold text-slate-500 hover:border-blue-400 hover:text-blue-600 transition disabled:opacity-40 disabled:hover:border-slate-300 disabled:hover:text-slate-500 disabled:cursor-not-allowed" data-i18n="addText"></button>
        </div>

                </div>
                <div data-panel="style" role="tabpanel" class="hidden space-y-6 pt-4">
        <!-- Pilihan font -->
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="fontLabel"></label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <label class="flex items-center gap-2 p-3 border border-slate-200 rounded-xl cursor-pointer text-sm has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
                    <input type="radio" name="font" value="default" checked class="accent-blue-600">
                    <span data-i18n="fontDefault"></span>
                </label>
                <label class="flex items-center gap-2 p-3 border border-slate-200 rounded-xl cursor-pointer text-sm has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
                    <input type="radio" name="font" value="impact" class="accent-blue-600">
                    <span style="font-family:Impact,'Anton',sans-serif" data-i18n="fontImpact"></span>
                </label>
                <label class="flex items-center gap-2 p-3 border border-slate-200 rounded-xl cursor-pointer text-sm has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
                    <input type="radio" name="font" value="anton" class="accent-blue-600">
                    <span style="font-family:'Anton',Impact,sans-serif" data-i18n="fontAnton"></span>
                </label>
            </div>
            <p class="text-xs text-slate-400 mt-2" data-i18n="fontNote"></p>
        </div>

        <!-- Warna teks & stroke (outline) -->
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="styleLabel"></label>
            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center justify-between gap-2 p-3 border border-slate-200 rounded-xl text-sm">
                    <span data-i18n="fillColor"></span>
                    <input type="color" id="fillColor" value="#ffffff" class="h-8 w-10 shrink-0 cursor-pointer rounded border border-slate-200 bg-white p-0.5">
                </label>
                <label class="flex items-center justify-between gap-2 p-3 border border-slate-200 rounded-xl text-sm">
                    <span data-i18n="strokeColor"></span>
                    <input type="color" id="strokeColor" value="#000000" class="h-8 w-10 shrink-0 cursor-pointer rounded border border-slate-200 bg-white p-0.5">
                </label>
            </div>
            <div class="mt-3">
                <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
                    <span data-i18n="strokeWidth"></span>
                    <span id="strokeWidthVal">0px</span>
                </div>
                <input type="range" id="strokeWidth" min="0" max="20" value="0" class="w-full custom-slider accent-blue-600">
            </div>
        </div>

                </div>
                <div data-panel="image" role="tabpanel" class="hidden space-y-6 pt-4">
        <!-- Pilihan bentuk sudut -->
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="shape"></label>
            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center gap-2 p-3 border border-slate-200 rounded-xl cursor-pointer text-sm has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
                    <input type="radio" name="shape" value="square" checked class="accent-blue-600">
                    <span data-i18n="square"></span>
                </label>
                <label class="flex items-center gap-2 p-3 border border-slate-200 rounded-xl cursor-pointer text-sm has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
                    <input type="radio" name="shape" value="rounded" class="accent-blue-600">
                    <span data-i18n="rounded"></span>
                </label>
            </div>
            <p class="text-xs text-slate-400 mt-2" data-i18n="shapeNote"></p>
        </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        /* ===== Terjemahan (ID / EN) ===== */
        const I18N = {
            id: {
                pageTitle: 'Meme Generator Dinamis',
                title: 'Meme Generator',
                subtitle: 'Buat meme kustom dengan ukuran gambar otomatis (Portrait/Landscape)',
                upload: 'Upload Foto / Gambar',
                chooseFile: 'Pilih File',
                noFile: 'Belum ada file dipilih',
                privacy: 'Gambar yang kamu kirim hanya di-render di perangkatmu (client side, bukan server side), jadi aku tidak menyimpan apa pun!',
                textLabel: 'Teks Meme (Kreatif sesukamu!)',
                textPlaceholder: 'Masukkan teks di sini...',
                layer: 'Teks',
                remove: 'Hapus',
                addText: '+ Tambah Teks',
                defTop: 'Teks atas',
                defBottom: 'Teks bawah',
                defNew: 'Teks baru',
                fontSize: 'Ukuran Huruf (kecil hingga besar!)',
                posY: 'Posisi Vertikal (naik hingga turun!)',
                posX: 'Posisi Horizontal (kanan hingga kiri!)',
                fontLabel: 'Jenis Font',
                fontDefault: 'Bawaan (Noto Sans)',
                fontImpact: 'Impact (klasik)',
                fontAnton: 'Anton (mirip Impact)',
                fontNote: 'Impact adalah font meme klasik, tapi tidak ada di semua perangkat (mis. banyak HP Android). Jika tidak ada, otomatis memakai Anton. Huruf non-Latin (mis. Hangul) memakai font bawaan.',
                tabText: 'Teks',
                tabStyle: 'Gaya',
                tabImage: 'Gambar',
                adjust: 'Atur ukuran & posisi',
                styleLabel: 'Warna & Stroke Teks',
                fillColor: 'Warna Teks',
                strokeColor: 'Warna Stroke',
                strokeWidth: 'Ketebalan Stroke (0 = tanpa stroke)',
                shape: 'Bentuk Gambar (Pilih sudutnya mau gimana!)',
                square: 'Kotak (Square)',
                rounded: 'Rounded (Membulat)',
                shapeNote: 'Mode Rounded menghasilkan PNG dengan sudut transparan.',
                placeholder: 'Belum ada gambar yang diunggah. Silakan upload foto terlebih dahulu.',
                download: 'Download PNG',
                error: 'Gagal mendownload gambar. Silakan coba lagi.'
            },
            en: {
                pageTitle: 'Dynamic Meme Generator',
                title: 'Meme Generator',
                subtitle: 'Make custom memes with automatic image sizing (Portrait/Landscape)',
                upload: 'Upload Photo / Image',
                chooseFile: 'Choose File',
                noFile: 'No file chosen',
                privacy: "The image you send is only rendered on your device (client side, not server side), so I don't store anything!",
                textLabel: 'Meme Text (Get creative!)',
                textPlaceholder: 'Enter your text here...',
                layer: 'Text',
                remove: 'Remove',
                addText: '+ Add Text',
                defTop: 'Top text',
                defBottom: 'Bottom text',
                defNew: 'New text',
                fontSize: 'Font Size (small to big!)',
                posY: 'Vertical Position (up to down!)',
                posX: 'Horizontal Position (left to right!)',
                fontLabel: 'Font',
                fontDefault: 'Default (Noto Sans)',
                fontImpact: 'Impact (classic)',
                fontAnton: 'Anton (Impact-like)',
                fontNote: "Impact is the classic meme font, but it isn't available on every device (e.g. many Android phones). If missing, Anton is used automatically. Non-Latin characters (e.g. Hangul) use the default font.",
                tabText: 'Text',
                tabStyle: 'Style',
                tabImage: 'Image',
                adjust: 'Size & position',
                styleLabel: 'Text Color & Stroke',
                fillColor: 'Text Color',
                strokeColor: 'Stroke Color',
                strokeWidth: 'Stroke Width (0 = no stroke)',
                shape: 'Image Shape (Pick your corners!)',
                square: 'Square',
                rounded: 'Rounded',
                shapeNote: 'Rounded mode exports a PNG with transparent corners.',
                placeholder: 'No image uploaded yet. Please upload a photo first.',
                download: 'Download PNG',
                error: 'Failed to download the image. Please try again.'
            }
        };

        let lang = 'id';
        let currentFileName = '';

        /* ===== Data teks (layers) ===== */
        const MAX_LAYERS = 6;
        const NEW_POS = [12, 88, 50, 70, 30, 50]; // posisi Y untuk teks yang baru ditambahkan
        let nextId = 1;
        function makeLayer(defKey, y) {
            return { id: nextId++, text: '', defKey, size: 32, x: 50, y };
        }
        // Awal: satu teks di atas dan satu di bawah (gaya meme klasik)
        let layers = [makeLayer('defTop', 12), makeLayer('defBottom', 88)];

        const layersEl = document.getElementById('layers');
        const addBtn = document.getElementById('addLayerBtn');

        function detectLang() {
            try {
                const saved = localStorage.getItem('memeLang');
                if (saved === 'id' || saved === 'en') return saved;
            } catch (e) {}
            return (navigator.language || 'id').toLowerCase().startsWith('id') ? 'id' : 'en';
        }

        function setLang(l) {
            lang = l;
            try { localStorage.setItem('memeLang', l); } catch (e) {}
            const t = I18N[l];
            document.documentElement.lang = l;
            document.title = t.pageTitle;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
            document.getElementById('fileName').textContent = currentFileName || t.noFile;

            // Ganti teks bawaan sesuai bahasa, tapi jangan timpa teks yang sudah diketik pengguna
            layers.forEach(layer => {
                const known = Object.values(I18N).map(x => x[layer.defKey]);
                if (layer.text === '' || known.includes(layer.text)) layer.text = t[layer.defKey];
            });

            const on = 'bg-blue-600 text-white';
            const off = 'bg-white text-slate-600 hover:bg-slate-50';
            document.getElementById('langId').className = 'px-3 py-1.5 transition ' + (l === 'id' ? on : off);
            document.getElementById('langEn').className = 'px-3 py-1.5 transition ' + (l === 'en' ? on : off);

            renderLayers();
            render();
        }

        /* ===== Tab kontrol ===== */
        function setTab(name) {
            document.querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== name));
            document.querySelectorAll('[data-tab]').forEach(b => {
                const active = b.dataset.tab === name;
                b.setAttribute('aria-selected', active);
                b.className = 'rounded-xl px-2 py-2.5 transition ' + (active ? 'bg-blue-600 text-white shadow' : 'bg-blue-50 text-blue-700 hover:bg-blue-100');
            });
        }

        /* ===== UI daftar teks ===== */
        function sliderHtml(field, label, min, max, val, unit) {
            return `
                <div>
                    <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
                        <span>${label}</span>
                        <span data-val="${field}">${val}${unit}</span>
                    </div>
                    <input type="range" data-field="${field}" min="${min}" max="${max}" value="${val}" class="w-full custom-slider accent-blue-600">
                </div>`;
        }

        function renderLayers() {
            const t = I18N[lang];
            layersEl.innerHTML = '';
            layers.forEach((l, i) => {
                const card = document.createElement('div');
                card.className = 'space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-100';
                card.dataset.id = l.id;
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-700">${t.layer} ${i + 1}</span>
                        ${layers.length > 1 ? `<button type="button" data-action="remove" class="text-xs font-semibold text-red-500 hover:text-red-600 px-2 py-2 -my-2">${t.remove}</button>` : ''}
                    </div>
                    <textarea data-field="text" rows="2" placeholder="${t.textPlaceholder}" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
                    <details>
                        <summary class="cursor-pointer select-none text-xs font-semibold text-blue-600 py-2">${t.adjust}</summary>
                        <div class="space-y-3 pt-2">
                            ${sliderHtml('size', t.fontSize, 12, 150, l.size, 'px')}
                            ${sliderHtml('y', t.posY, 0, 100, l.y, '%')}
                            ${sliderHtml('x', t.posX, 0, 100, l.x, '%')}
                        </div>
                    </details>
                `;
                card.querySelector('textarea').value = l.text; // lewat .value agar karakter khusus aman
                layersEl.appendChild(card);
            });
            addBtn.disabled = layers.length >= MAX_LAYERS;
        }

        // Event delegation: ketik / geser slider tanpa membangun ulang UI (fokus tidak hilang)
        layersEl.addEventListener('input', (e) => {
            const field = e.target.dataset.field;
            if (!field) return;
            const card = e.target.closest('[data-id]');
            const layer = layers.find(x => x.id === +card.dataset.id);
            if (!layer) return;
            if (field === 'text') {
                layer.text = e.target.value;
            } else {
                layer[field] = +e.target.value;
                card.querySelector(`[data-val="${field}"]`).textContent = layer[field] + (field === 'size' ? 'px' : '%');
            }
            render();
        });

        layersEl.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action="remove"]');
            if (!btn) return;
            const id = +btn.closest('[data-id]').dataset.id;
            if (layers.length <= 1) return;
            layers = layers.filter(x => x.id !== id);
            renderLayers();
            render();
        });

        function addLayer() {
            if (layers.length >= MAX_LAYERS) return;
            const layer = makeLayer('defNew', NEW_POS[layers.length % NEW_POS.length]);
            layer.text = I18N[lang].defNew;
            layers.push(layer);
            renderLayers();
            render();
        }

        /* ===== Meme generator ===== */
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('memeCanvas');
        const ctx = canvas.getContext('2d');
        const placeholderText = document.getElementById('placeholderText');
        const downloadBtn = document.getElementById('downloadBtn');

        const MAX_SIDE = 4096; // batas aman agar canvas tidak terlalu besar
        const REF_WIDTH = 600; // ukuran huruf slider dihitung relatif terhadap lebar 600px
        const BASE_STACK = '"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",ui-sans-serif,system-ui,sans-serif';

        // Anton hanya punya satu ketebalan (400), jadi tidak diberi bold palsu.
        // Karakter yang tidak ada di Anton (mis. Hangul) jatuh ke font berikutnya di daftar.
        const FONTS = {
            default: { stack: BASE_STACK, weight: 700 },
            impact:  { stack: 'Impact,Haettenschweiler,"Arial Narrow Bold","Anton",' + BASE_STACK, weight: 400 },
            anton:   { stack: '"Anton",Impact,' + BASE_STACK, weight: 400 }
        };

        function currentFont() {
            const key = document.querySelector('input[name="font"]:checked').value;
            return FONTS[key] || FONTS.default;
        }

        let img = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            currentFileName = file.name;
            document.getElementById('fileName').textContent = currentFileName;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const image = new Image();
                image.onload = () => {
                    img = image;
                    const scale = Math.min(1, MAX_SIDE / Math.max(image.naturalWidth, image.naturalHeight));
                    canvas.width = Math.round(image.naturalWidth * scale);
                    canvas.height = Math.round(image.naturalHeight * scale);
                    canvas.classList.remove('hidden');
                    placeholderText.classList.add('hidden');
                    downloadBtn.classList.remove('hidden');
                    render();
                };
                image.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.querySelectorAll('input[name="shape"]').forEach(el => el.addEventListener('change', render));
        ['fillColor', 'strokeColor'].forEach(id => document.getElementById(id).addEventListener('input', render));
        document.getElementById('strokeWidth').addEventListener('input', (e) => {
            document.getElementById('strokeWidthVal').textContent = e.target.value + 'px';
            render();
        });

        // Pastikan Anton sudah termuat sebelum digambar ke canvas, kalau belum hasilnya jatuh ke font lain
        function ensureFontLoaded() {
            if (!document.fonts || !document.fonts.load) return Promise.resolve();
            return document.fonts.load('400 32px "Anton"').catch(() => {});
        }
        document.querySelectorAll('input[name="font"]').forEach(el => {
            el.addEventListener('change', () => { render(); ensureFontLoaded().then(render); });
        });

        function isRounded() {
            return document.querySelector('input[name="shape"]:checked').value === 'rounded';
        }

        function roundedRectPath(c, x, y, w, h, r) {
            c.beginPath();
            c.moveTo(x + r, y);
            c.arcTo(x + w, y, x + w, y + h, r);
            c.arcTo(x + w, y + h, x, y + h, r);
            c.arcTo(x, y + h, x, y, r);
            c.arcTo(x, y, x + w, y, r);
            c.closePath();
        }

        // Bungkus teks: hormati Enter, pecah per kata, dan per karakter jika satu kata terlalu panjang (Hangul dll.)
        function wrapText(c, text, maxW) {
            const out = [];
            text.split('\n').forEach(par => {
                if (par === '') { out.push(''); return; }
                let line = '';
                par.split(' ').forEach(word => {
                    const test = line ? line + ' ' + word : word;
                    if (c.measureText(test).width <= maxW) { line = test; return; }
                    if (line) { out.push(line); line = ''; }
                    if (c.measureText(word).width <= maxW) { line = word; return; }
                    for (const ch of word) {
                        const t = line + ch;
                        if (line && c.measureText(t).width > maxW) { out.push(line); line = ch; }
                        else line = t;
                    }
                });
                out.push(line);
            });
            return out;
        }

        function render() {
            if (!img) return;

            const w = canvas.width, h = canvas.height;
            const k = w / REF_WIDTH; // faktor skala: preview & download pakai canvas yang sama
            const font = currentFont();

            ctx.clearRect(0, 0, w, h);
            ctx.save();

            if (isRounded()) {
                roundedRectPath(ctx, 0, 0, w, h, Math.min(w, h) * 0.04);
                ctx.clip();
            }

            ctx.drawImage(img, 0, 0, w, h);

            ctx.fillStyle = document.getElementById('fillColor').value;
            const sw = +document.getElementById('strokeWidth').value;
            const strokeColor = document.getElementById('strokeColor').value;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 5 * k;
            ctx.shadowOffsetY = 2 * k;

            // Gambar semua teks, masing-masing dengan ukuran dan posisinya sendiri
            layers.forEach(layer => {
                if (!layer.text) return;
                const fs = layer.size * k;
                ctx.font = `${font.weight} ${fs}px ${font.stack}`;
                const lines = wrapText(ctx, layer.text, w * 0.92);
                const lineH = fs * 1.2;
                const cx = w * layer.x / 100;
                const cy = h * layer.y / 100;
                let y = cy - (lines.length * lineH) / 2 + lineH / 2;
                // Stroke digambar dulu (setengah tebalnya tertutup huruf), bayangan hanya di lapisan stroke
                if (sw > 0) {
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = sw * k * 2;
                    ctx.lineJoin = 'round';
                    ctx.miterLimit = 2;
                    let ys = y;
                    lines.forEach(l => { ctx.strokeText(l, cx, ys); ys += lineH; });
                    ctx.shadowColor = 'transparent';
                }
                lines.forEach(l => { ctx.fillText(l, cx, y); y += lineH; });
                if (sw > 0) ctx.shadowColor = 'rgba(0,0,0,0.8)';
            });

            ctx.restore();
        }

        function downloadMeme() {
            if (!img) return;
            canvas.toBlob((blob) => {
                if (!blob) { alert(I18N[lang].error); return; }
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'meme-buatanmu.png';
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, 'image/png');
        }

        setTab('text');
        setLang(detectLang());
        // Render ulang setelah font siap agar hasil konsisten
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
        ensureFontLoaded().then(render);
    </script>
